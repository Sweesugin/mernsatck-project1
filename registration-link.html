<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration for TechFusion</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('images/s4.jpg'); /* Same background image as main page */
            background-size: cover; /* Ensure the image covers the entire screen */
            background-position: center center; /* Center the image */
            background-attachment: fixed; /* Keep the background fixed during scrolling */
            color: #faf0f0; /* Light text color for contrast */
            height: 100vh; /* Ensure the body takes up full height */
        }
        header, footer {
            text-align: center;
            color: rgb(240, 233, 233);
            padding: 20px 0;
        }
        main {
            max-width: 600px;
            margin: 20px auto;
            background-color: rgba(255, 255, 255, 0.8); /* Slightly transparent white background */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="submit"] {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1em;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .confirmation-message {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        footer p {
            margin: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>Register for TechFusion</h1>
    <p>Fill out the form below to secure your spot for the workshop!</p>
</header>

<main>
    <!-- Confirmation message (initially hidden) -->
    <div class="confirmation-message" id="confirmationMessage">
        <p>Thank you for registering! Your spot has been confirmed.</p>
    </div>

    <!-- Registration form -->
    <form id="registrationForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">

        <input type="submit" value="Register Now">
    </form>
</main>

<footer>
    <p>&copy; 2023 PSG College of Arts and Science. All rights reserved.</p>
</footer>

<script>
    // Handle form submission
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent form from submitting to the server
        
        // Show the confirmation message
        document.getElementById('confirmationMessage').style.display = 'block';
        
        // Optionally, clear the form after submission
        document.getElementById('registrationForm').reset();
    });
</script>

</body>
</html>
